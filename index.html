    <!-- Global error and Vite websocket connection handler for sandbox environment -->
    <script>
      (function() {
        // 1. Filter console.error and console.warn for benign Vite websocket messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var combined = args.map(function(a) {
            return (a && (a.message || a.stack || a)) || '';
          }).join(' ');

          if (
            combined.indexOf('[vite]') !== -1 ||
            combined.indexOf('failed to connect to websocket') !== -1 ||
            combined.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var combined = args.map(function(a) {
            return (a && (a.message || a.stack || a)) || '';
          }).join(' ');

          if (
            combined.indexOf('[vite]') !== -1 ||
            combined.indexOf('failed to connect to websocket') !== -1 ||
            combined.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        // 2. Catch unhandled rejections and window errors for websocket
        function isViteWsError(err) {
          if (!err) return false;
          var str = (typeof err === 'string' ? err : (err.message || err.reason || err.stack || '')) + '';
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('Illegal invocation') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || isViteWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
